services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sgp_minero_db}
      POSTGRES_USER: ${DB_USER:-usuario_local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_seguro_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-usuario_local} -d ${DB_NAME:-sgp_minero_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: ["/bin/sh", "/app/entrypoint.sh"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-dev-only-change-me-use-a-real-secret}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-False}
      REFRESH_TOKEN_COOKIE_SAMESITE: ${REFRESH_TOKEN_COOKIE_SAMESITE:-Strict}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-3}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-5}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-False}
      SEED_DEMO_MASTER_DATA: ${SEED_DEMO_MASTER_DATA:-False}
      DJANGO_SUPERUSER_RUT: ${DJANGO_SUPERUSER_RUT:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DEMO_CARGADOR_RUT: ${DEMO_CARGADOR_RUT:-}
      DEMO_CARGADOR_EMAIL: ${DEMO_CARGADOR_EMAIL:-}
      DEMO_CARGADOR_PASSWORD: ${DEMO_CARGADOR_PASSWORD:-}
      DEMO_CONSULTOR_RUT: ${DEMO_CONSULTOR_RUT:-}
      DEMO_CONSULTOR_EMAIL: ${DEMO_CONSULTOR_EMAIL:-}
      DEMO_CONSULTOR_PASSWORD: ${DEMO_CONSULTOR_PASSWORD:-}
      DB_NAME: ${DB_NAME:-sgp_minero_db}
      DB_USER: ${DB_USER:-usuario_local}
      DB_PASSWORD: ${DB_PASSWORD:-password_seguro_local}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

volumes:
  pgdata: